<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2129"/>
      <stop offset="1" stop-color="#14161B"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <g transform="translate(0 16)">
  <!-- tachometer arc: 270 degree sweep, open at the bottom -->
  <path d="M 171.1 336.9 A 120 120 0 1 1 316.0 148.1" fill="none" stroke="#F3F4F6" stroke-width="32" stroke-linecap="round"/>
  <!-- redline -->
  <path d="M 316.0 148.1 A 120 120 0 0 1 340.9 336.9" fill="none" stroke="#FF5A1F" stroke-width="32" stroke-linecap="round"/>
  <!-- needle -->
  <path d="M 256 246 L 289.0 188.8" fill="none" stroke="#FF5A1F" stroke-width="32" stroke-linecap="round"/>
  <circle cx="256" cy="246" r="22" fill="#F3F4F6"/>
  </g>
</svg>
